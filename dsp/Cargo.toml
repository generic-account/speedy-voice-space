[package]
name = "dsp"
version = "0.1.0"
edition = "2021"
description = "Client-side voice DSP (pitch, formants, denoise) for speedy-voice-space, compiled to WebAssembly."

[lib]
# cdylib → wasm module; rlib → native unit/parity tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
aberth = { version = "0.4.1", default-features = false, features = ["libm"] }
nnnoiseless = { version = "0.5.2", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true

# Skip wasm-pack's bundled wasm-opt: it's too old to parse modern wasm-bindgen
# output (a second table for reference types -> "Only 1 table allowed in MVP").
# The binary is already release-optimized by rustc; this just drops the extra pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
