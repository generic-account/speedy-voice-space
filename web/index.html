<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speedy Voice Space</title>
    <meta
      name="description"
      content="Real-time, in-browser pitch and resonance (formant) tracking for voice training. All audio is processed locally via WebAssembly — nothing is uploaded."
    />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Speedy Voice Space" />
    <meta
      property="og:description"
      content="Real-time, in-browser pitch and resonance tracking for voice training. Runs entirely in your browser."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23000'/><g stroke='%235aa6ff' stroke-width='3' stroke-linecap='round'><line x1='8' y1='12' x2='8' y2='20'/><line x1='14' y1='7' x2='14' y2='25'/><line x1='20' y1='10' x2='20' y2='22'/><line x1='26' y1='5' x2='26' y2='27'/></g></svg>"
    />
    <style>
      html, body, #root { margin: 0; height: 100%; }
      body { overflow: hidden; background: #000000; color: #ffffff; color-scheme: dark; }
      /* Dark form controls (these use browser defaults, so style them globally). */
      input, select, button {
        background: #2a2a2a;
        color: #e6e6e6;
        border: 1px solid #444;
        border-radius: 3px;
        font: inherit;
      }
      button { padding: 2px 10px; cursor: pointer; }
      button:hover, select:hover { background: #333; }
      input:focus, select:focus, button:focus-visible { outline: 1px solid #5aa6ff; }
      input[type="checkbox"] { accent-color: #5aa6ff; }
      /* Drop number-input spinners so narrow grid cells show full values. */
      input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
